<section id="code" data-transition="fade">
<h2>コードは 8 行まで。題でコードの要点を言う</h2>
<div class="code mid">
<p style="font-size:34px"><span class="k">const</span> result = <span class="k">await</span> doSomething({</p>
<p style="font-size:34px" class="i1">name: <span class="s">"example"</span>,</p>
<p style="font-size:34px" class="i1">execute: existingFunction,</p>
<p style="font-size:34px">});</p>
</div>
<div class="foot"><p class="num"></p></div>
<aside>1 行 1 つの p。字下げは .i1 / .i2。34px で 8 行を超えるなら、コードの枚と説明の枚に分ける。</aside>
</section>
