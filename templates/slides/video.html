<section id="video" data-transition="fade">
<h2>公式の動画で動きを見る</h2>
<div class="row" style="gap:48px; align-items:flex-start">
<div class="figure">
<iframe src="https://www.youtube-nocookie.com/embed/（動画の id）?hl=ja&rel=0" title="（動画の題）" allow="autoplay; fullscreen; encrypted-media" allowfullscreen style="width:1000px; height:563px; border:2px solid var(--line); border-radius:8px; display:block"></iframe>
</div>
<div class="lines" style="gap:24px; padding-top:8px">
<p class="line" style="font-size:36px">出所<br>「動画の題」</p>
<p class="line" style="font-size:36px">動画で分かること:<br>1 行で</p>
<p class="sub" style="font-size:28px">youtube.com/watch?v=（動画の id）</p>
</div>
</div>
<div class="foot"><p class="num"></p></div>
<aside>プレゼン表示では a タグのリンクは効かない（左半分のクリックは前の枚に戻る）。iframe は「再生ボタン＋Open on YouTube」の枠に置き換わり、押すと YouTube が新しいタブで開く。枠の中では再生されない。HTML に書き出すと黒い枠だけになるので URL の文字を残す。</aside>
</section>
